{% extends "base.html" %}
{% block content %}
<h4 class="mb-4">Compagnies</h4>
<div class="list-group">
    {% for c in compagnies %}
    <a href="{{ url_for('compagnie', compagnie_id=c.id) }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        {{ c.nom }}
        <i class="fas fa-chevron-right"></i>
    </a>
    {% endfor %}
</div>
{% endblock %}
